# ――――――――――――――――――――――――――――――――――――――――
#  tmux config — catppuccin macchiato
# ――――――――――――――――――――――――――――――――――――――――

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ―― General ――――――――――――――――――――――――――――
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g escape-time 0
set -g history-limit 10000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ―― Vi mode ――――――――――――――――――――――――――――
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Splits in current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Resize panes with Alt+hjkl (no prefix needed)
bind -n M-h resize-pane -L 2
bind -n M-j resize-pane -D 2
bind -n M-k resize-pane -U 2
bind -n M-l resize-pane -R 2

# ―― Catppuccin Macchiato palette ―――――――
%hidden BASE="#24273a"
%hidden SURFACE0="#363a4f"
%hidden SURFACE1="#494d64"
%hidden TEXT="#cad3f5"
%hidden SUBTEXT0="#a5adcb"
%hidden LAVENDER="#b7bdf8"
%hidden BLUE="#8aadf4"
%hidden OVERLAY0="#6e738d"

# ―― Status bar ―――――――――――――――――――――――――
set -g status-position top
set -g status-interval 30
set -g status-justify left
set -g status-style "bg=#{BASE},fg=#{TEXT}"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#{BASE},bg=#{LAVENDER},bold]  #S #[fg=#{LAVENDER},bg=#{BASE}] "

# Right: date and time
set -g status-right-length 40
set -g status-right "#[fg=#{SUBTEXT0}]%a %d %b #[fg=#{OVERLAY0}]│#[fg=#{TEXT}] %H:%M "

# Window tabs
setw -g window-status-format "#[fg=#{OVERLAY0}]  #I #W  "
setw -g window-status-current-format "#[fg=#{BASE},bg=#{BLUE},bold]  #I #W  #[fg=#{BLUE},bg=#{BASE}]"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#{SURFACE1}"
set -g pane-active-border-style "fg=#{LAVENDER}"

# Message/command style
set -g message-style "bg=#{SURFACE0},fg=#{TEXT}"
set -g mode-style "bg=#{SURFACE1},fg=#{TEXT}"
