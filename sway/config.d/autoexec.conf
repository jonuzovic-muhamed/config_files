exec_always {
  gsettings set org.gnome.desktop.interface gtk-theme Yaru-blue-dark
  gsettings set org.gnome.desktop.interface icon-theme Yaru-blue-dark
  gsettings set org.gnome.desktop.interface cursor-theme Yaru
  gsettings set org.gnome.desktop.interface gtk-application-prefer-dark-theme true
  gsettings set org.gnome.desktop.interface gtk-key-theme Yaru-blue-dark
  gsettings set org.gnome.desktop.interface gtk-color-scheme 'prefer-dark'
  gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
  gsettings set org.gnome.desktop.sound theme-name Yaru
  --no-startup-id /usr/bin/blueman-applet
  --no-startup-id /usr/bin/nm-applet --indicator

  # General
  export NATIVE_WAYLAND=1
  export CLUTTER_BACKEND=wayland
  export SDL_VIDEODRIVER=wayland
  export OZONE_PLATFORM=wayland

  # XDG Setup
  export XDG_SESSION_TYPE=wayland
  export XDG_SESSION_DESKTOP=wayland
  export XDG_CURRENT_DESKTOP=sway
  export XDG_SCREENSHOTS_DIR=$HOME/Pictures/Screenshots

  # GTK Setup
  export GDK_BACKEND=wayland
  export GTK_THEME=Yaru-blue-dark
  export GDK_SCALE=1
  export GDK_DPI_SCALE=1

  # Qt Setup
  export QT_QPA_PLATFORM=wayland
  export QT_QPA_PLATFORMTHEME=qt5ct
  export QT_QPA_PLATFORMTHEME=qt6ct
  export QT_STYLE_OVERRIDE=Kvantum

  # Applications
  export ELECTRON_OZONE_PLATFORM_HINT=wayland
  export MOZ_ENABLE_WAYLAND=1
  export ANKI_WAYLAND=1

  # Running idle Config
  exec swayidle -w \
    timeout 300 'gtklock -d' \
    timeout 500 'systemctl suspend' \
    before-sleep 'gtklock -d'

  # SSH Agent Setup
  export SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/ssh-agent.socket"
  eval `ssh-agent -s`

  # Start dbus session if not already
  if [ -z "$DBUS_SESSION_BUS_ADDRESS" ]; then
    eval "$(dbus-launch --sh-syntax --exit-with-session)"
  fi

  # Import environment into systemd user instance
  if command -v systemctl >/dev/null; then
    systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DBUS_SESSION_BUS_ADDRESS
  fi

  # Start portals (file pickers, URL openers, etc.)
  if command -v systemctl >/dev/null; then
    systemctl --user start xdg-desktop-portal xdg-desktop-portal-wlr
  fi

  # Secret Service provider (password store for browsers, git-credential-libsecret, etc.)
  exec_always --no-startup-id gnome-keyring-daemon --start --components=secrets,ssh,pkcs11
  set $ssh_auth_sock $XDG_RUNTIME_DIR/keyring/ssh
  exec_always --no-startup-id sh -lc 'export SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/keyring/ssh"'
}
