# GTK theming via gsettings (exec_always so it re-applies on reload)
exec_always gsettings set org.gnome.desktop.interface gtk-theme Yaru-blue-dark
exec_always gsettings set org.gnome.desktop.interface icon-theme Yaru-blue-dark
exec_always gsettings set org.gnome.desktop.interface cursor-theme Yaru
exec_always gsettings set org.gnome.desktop.interface gtk-application-prefer-dark-theme true
exec_always gsettings set org.gnome.desktop.interface gtk-key-theme Yaru-blue-dark
exec_always gsettings set org.gnome.desktop.interface gtk-color-scheme 'prefer-dark'
exec_always gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec_always gsettings set org.gnome.desktop.sound theme-name Yaru

# Push environment into systemd and dbus so child processes and portals see it
exec dbus-update-activation-environment --systemd \
    DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE \
    QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE \
    GDK_BACKEND MOZ_ENABLE_WAYLAND ELECTRON_OZONE_PLATFORM_HINT

# Tray applets (exec, not exec_always — avoids duplicates on reload)
exec /usr/bin/blueman-applet
exec /usr/bin/nm-applet --indicator

# Secret Service provider (passwords for browsers, git-credential-libsecret, etc.)
exec gnome-keyring-daemon --start --components=secrets,ssh,pkcs11
exec set $ssh_auth_sock $XDG_RUNTIME_DIR/keyring/ssh
exec sh -lc 'export SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/keyring/ssh"'

# Clipboard history manager
exec wl-paste --watch cliphist store -max-items 50

# Notification daemon (SwayNotificationCenter)
exec swaync