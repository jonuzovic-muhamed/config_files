# Idle and lock configuration using gtklock
#
# - Lock screen after 300 seconds of inactivity
# - Turn off displays 60 seconds after locking
# - Turn displays back on when activity resumes
# - Lock before sleep/suspend
#
# Requires: swayidle, gtklock

exec swayidle -w \
    timeout 300 'gtklock -d' \
    timeout 360 'swaymsg "output * power off"' \
         resume 'swaymsg "output * power on"' \
    timeout 60 'pgrep -x gtklock >/dev/null && swaymsg "output * power off"' \
        resume 'pgrep -x gtklock >/dev/null && swaymsg "output * power on"' \
    before-sleep 'gtklock -d'
