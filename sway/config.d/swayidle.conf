# Idle and lock configuration using swaylock
#
# - Lock screen after 900 seconds of inactivity
# - Turn off displays 60 seconds after locking
# - Turn displays back on when activity resumes
# - Lock before sleep/suspend
#
# Requires: swayidle, swaylock

exec swayidle -w \
    timeout 900 '~/.config/sway/scripts/swaylock.sh' \
    timeout 960 'swaymsg "output * power off"' \
         resume 'swaymsg "output * power on"' \
    timeout 60 'pgrep -x swaylock >/dev/null && swaymsg "output * power off"' \
        resume 'pgrep -x swaylock >/dev/null && swaymsg "output * power on"' \
    before-sleep '~/.config/sway/scripts/swaylock.sh'
