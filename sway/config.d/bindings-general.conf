set $superKey Super
set $workspaceSwitcherKey Control

# Terminal Emulator
set $term kitty

# Application Launcher
set $menu rofi -wayland -show drun -modi drun,filebrowser,recursivebrowser,run,window,ssh -line-padding 2 -hide-scrollbar 

# Lock Screen
set $lock gtklock -d

# Lock Screen
bindsym $superKey+l exec $lock

# Suspend/Sleep
set $suspend systemctl suspend
bindsym XF86PowerOff exec $lock && $suspend

# Start a terminal
bindsym $superKey+Return exec $term

# Kill focused window
bindsym $superKey+Shift+q kill

# Start your launcher
bindsym $superKey+Space exec $menu

# Clipboard history manager
bindsym $superKey+Shift+v exec bash -c 'cliphist list | rofi -dmenu | cliphist decode | wl-copy'
bindsym $superKey+Shift+x exec cliphist wipe

# Notifications (SwayNotificationCenter)
# Toggle notification center / history panel
bindsym $superKey+n exec swaync-client --toggle-panel

# Dismiss all visible popup notifications
bindsym $superKey+Shift+n exec swaync-client --close-all

# Toggle Do Not Disturb
bindsym $superKey+Control+n exec swaync-client --toggle-dnd

# Drag floating windows by holding down $superKey and left mouse button.
# Resize them with right mouse button + $superKey.
# Despite the name, also works for non-floating windows.
# Change normal to inverse to use left mouse button for resizing and right
# mouse button for dragging.
floating_modifier $superKey normal

# Reload the configuration file
bindsym $superKey+Shift+c reload

# Exit sway (logs you out of your Wayland session)
bindsym $superKey+Shift+Delete exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

# Moving around:

# Move focus with $superKey and the arrow keys
bindsym $superKey+Left focus left
bindsym $superKey+Down focus down
bindsym $superKey+Up focus up
bindsym $superKey+Right focus right

# Move the focused window with $superKey, Shift, and the arrow keys
bindsym $superKey+Shift+Left move left
bindsym $superKey+Shift+Down move down
bindsym $superKey+Shift+Up move up
bindsym $superKey+Shift+Right move right

# Workspaces:

# Switch to workspace
bindsym $workspaceSwitcherKey+1 workspace number 1
bindsym $workspaceSwitcherKey+2 workspace number 2
bindsym $workspaceSwitcherKey+3 workspace number 3
bindsym $workspaceSwitcherKey+4 workspace number 4
bindsym $workspaceSwitcherKey+5 workspace number 5
bindsym $workspaceSwitcherKey+6 workspace number 6
bindsym $workspaceSwitcherKey+7 workspace number 7
bindsym $workspaceSwitcherKey+8 workspace number 8
bindsym $workspaceSwitcherKey+9 workspace number 9
bindsym $workspaceSwitcherKey+0 workspace number 10

# Move focused container to workspace
bindsym $workspaceSwitcherKey+Shift+1 move container to workspace number 1
bindsym $workspaceSwitcherKey+Shift+2 move container to workspace number 2
bindsym $workspaceSwitcherKey+Shift+3 move container to workspace number 3
bindsym $workspaceSwitcherKey+Shift+4 move container to workspace number 4
bindsym $workspaceSwitcherKey+Shift+5 move container to workspace number 5
bindsym $workspaceSwitcherKey+Shift+6 move container to workspace number 6
bindsym $workspaceSwitcherKey+Shift+7 move container to workspace number 7
bindsym $workspaceSwitcherKey+Shift+8 move container to workspace number 8
bindsym $workspaceSwitcherKey+Shift+9 move container to workspace number 9
bindsym $workspaceSwitcherKey+Shift+0 move container to workspace number 10

# Note: workspaces can have any name you want, not just numbers.
# We just use 1-10 as the default.
#
# Layout stuff:
#
# You can "split" the current object of your focus with
# $superKey+b or $superKey+v, for horizontal and vertical splits
# respectively.
bindsym $superKey+h splith
bindsym $superKey+v splitv

# Switch the current container between different layout styles
bindsym $superKey+s layout stacking
bindsym $superKey+w layout tabbed
bindsym $superKey+e layout toggle split

# Make the current focus fullscreen
bindsym $superKey+f fullscreen

# Toggle the current focus between tiling and floating mode
bindsym $superKey+Shift+space floating toggle

# Move focus to the parent container
bindsym $superKey+a focus parent

# Scratchpad:
#
# Sway has a "scratchpad", which is a bag of holding for windows.
# You can send windows there and get them back later.

# Move the currently focused window to the scratchpad
bindsym $superKey+Shift+minus move scratchpad

# Show the next scratchpad window or hide the focused scratchpad window.
# If there are multiple scratchpad windows, this command cycles through them.
bindsym $superKey+minus scratchpad show

# Resizing containers mode
#
mode "resize" {
    bindsym Left resize shrink width 10px # left will shrink the containers width
    bindsym Down resize grow height 10px  # down will grow the containers height
    bindsym Up resize shrink height 10px  # up will shrink the containers height
    bindsym Right resize grow width 10px  # right will grow the containers width

    # Return to default mode
    bindsym Escape+r mode "default"
}
bindsym $superKey+Control+r mode "resize"
